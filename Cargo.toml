[workspace]
resolver = "2"
members = ["native/kspcfg", "tools/ksplaunch", "tools/monohost"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/ksp-fastboot"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Panics must unwind so kspcfg's C ABI can catch them; aborting would take KSP down with it.
panic = "unwind"
