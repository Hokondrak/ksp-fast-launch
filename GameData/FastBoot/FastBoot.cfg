// FastBoot settings. Read once at startup, directly from this file (ModuleManager patches do not apply).
// Changing a value takes effect on the next launch.
FASTBOOT_SETTINGS
{
    // Parse GameData .cfg files with FastBoot's native parser (identical results, less main-thread time).
    ConfigParser = true

    // Worker threads for pre-parsing configs. 0 = automatic (CPU threads - 2, at most 8).
    ConfigParserThreads = 0

    // Cold-start warm-up: read the files KSP is about to load into the Windows file cache, in parallel and ahead
    // of the game, so a launch after a reboot is closer to a warm one. Learns the exact files from each boot.
    Warmup = true

    // Find sounds by name through an index instead of scanning every loaded sound. Same results; helps most when
    // mods look up many sounds while parts load (sound overhauls, engine and effect packs).
    FastLookups = true

    // Drag cube cache. After a mod change ModuleManager deletes KSP's drag cube cache (PartDatabase.cfg) and KSP
    // renders every part's drag cubes again.
    //   restore: put back the cubes of every part whose config, models and module code are unchanged and whose
    //            cubes KSP has rendered identically twice; KSP renders only the rest.
    //   check:   change nothing, only report whether reuse would have been correct.
    // Both write a report to PluginData/Diagnostics after a mod change.
    DragCubeCache = off

    // Write a boot timing report to GameData/FastBoot/PluginData/Diagnostics on every launch.
    Diagnostics = false

    // With Diagnostics: sample what the main thread is doing during freezes (Windows only).
    StallSampler = false

    // With the early-start loader: write Mono's own counters (time spent compiling code, methods compiled,
    // classes loaded) to PluginData/early.log at the main menu.
    MonoCounters = false

    // Profile one stretch of the boot by sampling the main thread every 2 ms (Windows only; slows that stretch
    // slightly). "parts" = part compilation. The report goes to PluginData/Diagnostics. Empty = off.
    Profile =
}
